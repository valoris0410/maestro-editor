<!doctype html>
<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
@font-face { font-family: "Anton"; src: url("../Tipografia audiovisual/fuentes/Anton-400.ttf"); }
@font-face { font-family: "Sinethar"; src: url("../Tipografia audiovisual/fuentes/Sinethar.otf"); }
@font-face { font-family: "Dancing Script"; src: url("../Tipografia audiovisual/fuentes/DancingScript-700.ttf"); }
@font-face { font-family: "Inter"; src: url("../Tipografia audiovisual/fuentes/Inter-600.ttf"); font-weight: 600; }
:root { --acento: #FFD23F; --acento2: #FF8A1F; }
html, body { margin: 0; background: transparent; }
#stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
#detras, #frente { position: absolute; inset: 0; }
/* VOZ: fuente System (receta de la persona): sombra negra suave + brillo blanco, espaciado -1; entra palabra por palabra */
.vz { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; opacity: 0;
  font: 700 76px/1.1 "Segoe UI", "Inter", system-ui, sans-serif; color: #fff; letter-spacing: -0.012em;
  text-shadow: 0 2px 12px rgba(0,0,0,.50), 0 2px 3px rgba(0,0,0,.60), 0 0 28px rgba(255,255,255,.28); }
.vz span { display: inline-block; margin: 0 .13em; opacity: 0; }
/* GOLPE: condensada pesada en mayúsculas, inclinada, núcleo claro + glow del color de acento */
.gp { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; opacity: 0;
  font-family: "Anton", Impact, sans-serif; text-transform: uppercase; line-height: .98; letter-spacing: .005em; }
.gp .wo { opacity: 0; }
.gp .w { display: inline-block; margin: 0 .11em; transform: skewX(-9deg);
  background: linear-gradient(180deg, #FFF6C8 0%, #FFE27A 55%, #FFC83D 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 8px rgba(255,190,40,.95)) drop-shadow(0 0 34px rgba(255,130,10,.80)) drop-shadow(0 0 80px rgba(255,90,0,.45)); }
.gp .w.ac { background: linear-gradient(180deg, #FFF04D 0%, var(--acento) 50%, var(--acento2) 100%); -webkit-background-clip: text; background-clip: text; }
/* CURSIVA: acento manuscrito de neón, rotado */
.cu { position: absolute; white-space: nowrap; opacity: 0; font-family: "Sinethar", "Dancing Script", cursive; font-size: 190px; line-height: 1;
  color: #FFEF4A; text-shadow: 0 0 6px #FFC21A, 0 0 18px var(--acento), 0 0 48px rgba(255,140,10,.95), 0 0 90px rgba(255,100,0,.5); transform-origin: 0 50%; }
</style>
<div id="stage"><div id="detras"></div><div id="frente"></div></div>
<script>
const PLAN = window.PLAN, ACENTO = window.ACENTO || "#FFD23F";
document.documentElement.style.setProperty("--acento", ACENTO);
const tl = gsap.timeline({ paused: true });
const BASE_GOLPE = 326;        // línea de base del texto clave (justo sobre el pelo: la cabeza tapa un poco de abajo)
const Y_VOZ = 1236;             // altura del pecho
const fit = (el, max) => { const w = el.scrollWidth; if (w > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w) + "px"; };

// ---- VOZ (frente)
PLAN.voz.forEach((it) => {
  const d = document.createElement("div"); d.className = "vz"; d.style.top = Y_VOZ + "px";
  const sp = it.palabras.map((p) => { const s = document.createElement("span"); s.textContent = p.txt; d.appendChild(s); return s; });
  document.getElementById("frente").appendChild(d); fit(d, 940);
  tl.set(d, { opacity: 1 }, Math.max(0, it.t0 - 0.001));
  sp.forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 16, scale: .86, filter: "blur(7px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: .17, ease: "power3.out" }, it.palabras[i].t));
  tl.to(d, { opacity: 0, duration: .09, ease: "none" }, it.t1 - 0.09);
  tl.set(d, { opacity: 0 }, it.t1);
});
// ---- GOLPE (detrás de la persona)
PLAN.golpe.forEach((it) => {
  const d = document.createElement("div"); d.className = "gp";
  const n = it.palabras.length, spans = [];
  const armar = (lineas) => { d.innerHTML = ""; spans.length = 0;
    lineas.forEach((l, li) => { const r = document.createElement("div"); r.style.fontSize = "250px";
      l.forEach((p) => { const o = document.createElement("span"); o.className = "wo"; o.style.display = "inline-block";
        const s = document.createElement("span"); s.className = "w" + (li === lineas.length - 1 && p === l[l.length - 1] ? " ac" : ""); s.textContent = p.txt; o.appendChild(s); r.appendChild(o); spans.push([o, p.t]); });
      d.appendChild(r); });
    document.getElementById("detras").appendChild(d);
    let k = 1; [...d.children].forEach((r) => { k = Math.min(k, 940 / r.scrollWidth); });
    return Math.min(250, 250 * k); };
  // una sola línea si queda grande (≥ 150 px); si no, dos líneas; el alto total nunca pasa de 320 px (el espacio libre sobre la cabeza)
  let fs = armar([it.palabras]), lineas = 1;
  if (fs < 150 && n > 1) { const c = Math.ceil(n / 2); fs = armar([it.palabras.slice(0, c), it.palabras.slice(c)]); lineas = 2; }
  fs = Math.min(fs, 320 / (.98 * lineas));
  [...d.children].forEach((r) => { r.style.fontSize = fs + "px"; });
  d.style.top = (BASE_GOLPE + 14 - d.offsetHeight) + "px";
  tl.set(d, { opacity: 1 }, Math.max(0, it.t0 - 0.001));
  spans.forEach(([o, t]) => tl.fromTo(o, { opacity: 0, scale: 1.45, y: -14, filter: "blur(16px)" },
    { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: .24, ease: "power3.out" }, t));
  tl.to(d, { opacity: 0, scale: .97, duration: .12, ease: "power1.in" }, it.t1 - 0.12);
  tl.set(d, { opacity: 0 }, it.t1);
});
// ---- CURSIVA (frente)
PLAN.cursiva.forEach((it, idx) => {
  const d = document.createElement("div"); d.className = "cu"; d.textContent = it.palabras.map((p) => p.txt).join(" ");
  document.getElementById("frente").appendChild(d);
  d.style.fontSize = "150px"; fit(d, 520);
  const izq = idx % 2 === 0;
  d.style.left = izq ? "36px" : "auto"; d.style.right = izq ? "auto" : "40px";
  // arriba de la frente (pelo y pared): nunca sobre los ojos ni las cejas
  d.style.top = (izq ? 292 : 312) + "px"; d.style.transform = `rotate(${izq ? -8 : 6}deg)`;
  tl.set(d, { opacity: 1, clipPath: "inset(-20% 100% -20% -5%)" }, Math.max(0, it.t0 - 0.001));
  tl.to(d, { clipPath: "inset(-20% -5% -20% -5%)", duration: .38, ease: "power2.out" }, it.t0);
  tl.to(d, { opacity: 0, filter: "blur(6px)", duration: .14 }, it.t1 - 0.14);
  tl.set(d, { opacity: 0 }, it.t1);
});
window.TL = tl;
</script>
